[project]
name = "synbios-forge"
version = "0.1.0"
description = "Local-first task, artifact, evidence and human review forge"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
synbios = "synbios.cli:main"

[tool.setuptools]
packages = ["synbios", "synbios.sym2p"]
