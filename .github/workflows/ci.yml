name: Verify forge
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: forge-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  backend:
    strategy:
      matrix:
        python: ['3.11', '3.14']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e .
      - run: python -m pip install -r requirements-bench.txt
      - run: python -m unittest discover -s tests -v
      - name: Tests leave tracked files unchanged
        run: git diff --exit-code
      - run: python -m synbios.shadow
      - run: python -m synbios.sym2p.bench
      - run: make bench
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
  browser:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: python -m pip install -e ..
      - run: SYNBIOS_RUN_DEMO_PARITY=1 python -m unittest tests.test_web_demo_parity -v
        working-directory: ..
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
